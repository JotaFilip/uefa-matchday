name: Daily fixture update

on:
  schedule:
    - cron: "0 0 * * *" # midnight UTC, after UCL matchdays are finished
  workflow_dispatch: # manual trigger from the Actions tab
    inputs:
      season:
        description: "Season start year to process (e.g. 2025). Empty = current season."
        required: false
        default: ""

permissions:
  contents: write # commit + push, release upload

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Season to process: manual runs can pass a year (e.g. to backfill a
      # past season); empty = current season (Aug 1 – Jul 31 rule).
      - name: Resolve season
        run: |
          SEASON="${{ github.event.inputs.season }}"
          if [ -z "$SEASON" ]; then
            M=$(date -u +%-m); Y=$(date -u +%Y)
            if [ "$M" -ge 8 ]; then SEASON=$Y; else SEASON=$((Y-1)); fi
          fi
          case "$SEASON" in
            [0-9][0-9][0-9][0-9]) ;;
            *) echo "season must be empty or a 4-digit year, got: $SEASON"; exit 1;;
          esac
          echo "SEASON=$SEASON" >> "$GITHUB_ENV"
          echo "Processing season $SEASON"

      # fixtures/ (small ESPN responses) and logos/ live in the Actions
      # cache, not the repo: cached days are instant, so each run only hits
      # the API for new dates. Saved again at the end of the job.
      - name: Restore fixtures + logos cache
        uses: actions/cache@v4
        with:
          path: |
            fixtures/
            logos/
          key: uefa-cache-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium (for PNG renders)
        run: |
          python3 -m pip install playwright
          # sudo resets PATH to the system python3, which lacks the module —
          # invoke the same interpreter pip installed into
          sudo "$(command -v python3)" -m playwright install --with-deps chromium

      # One run: fetch new fixtures (cached days are instant), refresh badges,
      # build the HTML pages and render the PNGs.
      - name: Run pipeline (fetch, badges, build + PNGs)
        run: python3 run.py --season "$SEASON" --image

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update fixtures and results ($(date -u +%F))"
            git push
          fi

      # One release per season: while the season is live the release is
      # updated daily (same asset names, overwritten); in August a new
      # season tag is created and the previous one freezes at the final.
      - name: Publish PNGs to the season release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$SEASON" >/dev/null 2>&1 || \
            gh release create "$SEASON" --title "Season $SEASON" --notes ""
          gh release upload "$SEASON" standings/"$SEASON"/*.png --clobber
          # Embed the images in the release notes so they view inline in the
          # browser — plain asset links force a download
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$SEASON"
          NOTES="UEFA $SEASON standings — updated daily while the season is live."
          NL=$'\n\n'
          for n in champions_knockout champions_league europa_knockout \
                   europa_league conference_knockout conference_league; do
            f="${n}_$SEASON.png" # build_standings.py names files <name>_<season>.png
            [ -f "standings/$SEASON/$f" ] || continue
            NOTES="${NOTES}${NL}![]($BASE/$f)"
          done
          gh release edit "$SEASON" --notes "$NOTES"
