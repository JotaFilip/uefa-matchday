name: Daily fixture update

on:
  schedule:
    - cron: "0 0 * * *" # midnight UTC, after UCL matchdays are finished
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fixtures/ (small ESPN responses) and logos/ live in the Actions
      # cache, not the repo: cached days are instant, so each run only hits
      # the API for new dates. Saved again at the end of the job.
      - name: Restore fixtures + logos cache
        uses: actions/cache@v4
        with:
          path: |
            fixtures/
            logos/
          key: uefa-cache-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium (for PNG renders)
        run: |
          python3 -m pip install playwright
          sudo python3 -m playwright install --with-deps chromium

      # Full scan of the season window, but with the cached fixtures every
      # day that already has a response is instant — only new dates and
      # days without matches (re-checked so knockout fixtures appear as
      # soon as ESPN publishes them after the draw) hit the API.
      - name: Fetch fixtures
        run: python3 fetch_fixtures.py

      # Badges for the PNG renders (fast when the logos cache is warm).
      - name: Refresh club badges
        run: python3 fetch_logos.py

      - name: Rebuild pages and render PNGs
        run: python3 fetch_fixtures.py --image

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update fixtures and results ($(date -u +%F))"
            git push
          fi

      # One release per season: while the season is live the release is
      # updated daily (same asset names, overwritten); in August a new
      # season tag is created and the previous one freezes at the final.
      - name: Publish PNGs to the season release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M=$(date -u +%-m); Y=$(date -u +%Y)
          if [ "$M" -ge 8 ]; then SEASON=$Y; else SEASON=$((Y-1)); fi
          gh release view "$SEASON" >/dev/null 2>&1 || \
            gh release create "$SEASON" --title "Season $SEASON" \
              --notes "UEFA $SEASON standings — updated daily while the season is live."
          gh release upload "$SEASON" standings/"$SEASON"/*.png --clobber
